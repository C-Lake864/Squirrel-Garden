# staging 브랜치에 푸시되면 staging 에, main 에 푸시되면 승인을 거쳐 production 에 배포한다. 배포 전에 ci.yml 검사를 먼저 돌린다.
# 환경(staging, production)마다 Variables 에 SERVICE(squirrel-garden-staging / squirrel-garden), ENV(staging / production) 를 둔다.
name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v7

      - name: Google Cloud 인증 (키 파일 없이 WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Cloud Run 배포
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          source: .
          project_id: ${{ vars.GCP_PROJECT_ID }}
          env_vars: |
            GIT_SHA=${{ github.sha }}
            ENV=${{ vars.ENV }}
          flags: >-
            --service-account=${{ vars.RUNTIME_SA }}
            --build-service-account=projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.BUILD_SA }}
            --max-instances=1

      - name: 배포 주소
        run: echo "${{ steps.deploy.outputs.url }}"
