# staging 브랜치에 푸시되면 staging 에, main 에 푸시되면 승인을 거쳐 production 에 배포한다. 배포 전에 ci.yml 검사를 먼저 돌린다.
# 환경(staging, production)마다 Variables 에 SERVICE(squirrel-garden-staging / squirrel-garden), ENV(staging / production) 를 둔다.
name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGING_SERVICE: squirrel-garden-staging
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v7

      - name: Google Cloud 인증 (키 파일 없이 WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # 1. staging 브랜치에서만 이미지를 만들고, 이미지 이름과 커밋을 다음 단계로 넘긴다
      - name: 이미지 만들기와 올리기 (staging)
        if: github.ref_name != 'main'
        run: |
          IMAGE="${{ vars.AR_REPO }}/squirrel-garden:${{ github.sha }}"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"

      # 2. main 브랜치에서는 이미지를 만들지 않고, staging 리비전의 다이제스트와 커밋을 찾는다
      - name: staging 이미지 찾기 (production 승격)
        if: github.ref_name == 'main'
        run: |
          REV=$(gcloud run services describe "$STAGING_SERVICE" --region us-central1 --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          gcloud run revisions describe "$REV" --region us-central1 --format json > rev.json
          echo "IMAGE=$(jq -r '.status.imageDigest' rev.json)" >> "$GITHUB_ENV"
          echo "COMMIT=$(jq -r '.spec.containers[0].env[] | select(.name=="GIT_SHA") | .value' rev.json)" >> "$GITHUB_ENV"
          echo "staging 리비전 $REV 의 이미지를 승격한다"

      - name: Cloud Run 배포
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE }}
          no_traffic: true
          tag: green
          env_vars: |
            GIT_SHA=${{ env.COMMIT }}
            ENV=${{ vars.ENV }}
          flags: >-
            --service-account=${{ vars.RUNTIME_SA }}
            --max-instances=1

      - name: 배포 결과
        run: |
          echo "배포된 주소 ${{ steps.deploy.outputs.url }}"
          echo "배포한 이미지 $IMAGE"

      # 3. 스모크 테스트: 사용자에게 보내기 전에 green 태그 URL 로 새 리비전만 검사한다. 실패하면 여기서 멈춘다
      - name: 스모크 테스트 (새 리비전, 트래픽 0%)
        run: |
          URL=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format json | jq -r '.status.traffic[] | select(.tag=="green") | .url')
          if [ -z "$URL" ]; then echo "green 태그 URL 을 찾지 못했다"; exit 1; fi
          echo "검사할 주소 $URL"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$URL/health" > /dev/null; then
              GOT=$(curl -fsS --max-time 5 "$URL/version" | jq -r '.commit')
              echo "$i 번째 시도: /health 정상, 받은 커밋 $GOT"
              if [ "$GOT" = "$COMMIT" ]; then echo "스모크 테스트 통과"; exit 0; fi
            else
              echo "$i 번째 시도: /health 실패"
            fi
            sleep 5
          done
          echo "스모크 테스트 실패: 새 리비전으로 전환하지 않는다"
          exit 1

      # 4. 전환: 스모크 테스트를 통과했을 때만 여기까지 온다. 롤백할 곳(이전 리비전)을 로그에 남기고 100% 옮긴다
      # --to-latest 로 옮겨야 트래픽이 특정 리비전에 고정되지 않아 다음 배포도 같은 흐름으로 돈다
      - name: 새 리비전으로 전환
        run: |
          OLD=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format json | jq -r '[.status.traffic[] | select(.percent > 0) | .revisionName] | join(",")')
          echo "전환 전 리비전 $OLD (롤백할 때 쓴다)"
          gcloud run services update-traffic "${{ vars.SERVICE }}" --region us-central1 --to-latest
          NEW=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format "value(status.latestReadyRevisionName)")
          echo "전환 후 리비전 $NEW"
