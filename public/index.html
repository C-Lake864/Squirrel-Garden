<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>🌰 다람쥐 정원</title>
  <!-- 제목 폰트(Jua): Google Fonts. 접속자의 브라우저가 Google 에 폰트를 요청한다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>
        <svg class="logo" viewBox="0 0 24 26" width="36" height="39" aria-hidden="true">
          <path d="M12 2.5L13.2 4.6C18.5 5.4 22.8 9.5 22.8 15.5C22.8 21.2 18 25 12 25C6 25 1.2 21.2 1.2 15.5C1.2 9.5 5.5 5.4 10.8 4.6Z" fill="#9a5a2e"></path>
          <path d="M1.8 18.8C5 20.8 19 20.8 22.2 18.8C21 22.6 17 25 12 25C7 25 3 22.6 1.8 18.8Z" fill="#e3c595"></path>
        </svg>
        <span>다람쥐 정원</span>
      </h1>
      <p class="subtitle" id="status"></p>
    </header>

    <main>
      <!-- 다람쥐 정원 -->
      <section class="garden" id="garden"></section>

      <!-- 할 일 -->
      <section class="todos">
        <h2 class="section-title" id="list-title">오늘의 할 일</h2>
        <div class="tip">대충하기 버튼을 누르면 할 일을 더 쉽게 만들 수 있어요!<br />매일의 습관을 만들어보아요!</div>
        <form id="add-form" autocomplete="off">
          <input type="text" id="title" placeholder="할 일을 입력하세요" required />
          <div class="row">
            <input type="text" id="category" placeholder="카테고리" />
            <input type="date" id="due_date" />
            <button type="submit" class="add-btn" aria-label="할 일 추가">＋</button>
          </div>
        </form>

        <div class="filters">
          <button data-filter="today" class="active">오늘 할 일</button>
          <button data-filter="date">날짜별</button>
          <button data-filter="all">전체</button>
        </div>

        <!-- '날짜별'을 눌렀을 때만 보인다 -->
        <div class="date-nav" id="date-nav" hidden>
          <button type="button" id="date-prev" class="nav-btn" aria-label="이전 날">‹</button>
          <input type="date" id="date-pick" aria-label="날짜 선택" />
          <button type="button" id="date-next" class="nav-btn" aria-label="다음 날">›</button>
          <button type="button" id="date-today" class="today-btn">오늘</button>
        </div>

        <!-- 카테고리 필터: 쓰이고 있는 카테고리로 자동으로 만들어진다 -->
        <div class="cats" id="cats" role="group" aria-label="카테고리" hidden></div>

        <ul id="todo-list"></ul>
      </section>
    </main>
  </div>

  <p class="auth-note" id="auth-note"></p>

  <script src="app.js"></script>
</body>
</html>
