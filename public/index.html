<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>🌰 다람쥐 정원</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>
  </svg>
  <div class="app">
    <header>
      <h1>다람쥐 정원</h1>
      <p class="subtitle">오늘 할 일을 모두 끝내면 다람쥐가 알밤을 하나 묻어요. 한 달 동안 모으면 나무가 자랍니다!</p>
    </header>

    <main>
      <!-- 왼쪽: 다람쥐 정원 -->
      <section class="card garden" id="garden"></section>

      <!-- 오른쪽: 할 일 -->
      <section class="card todos">
        <p class="section-label">TODAY'S TASKS</p>
        <form id="add-form" autocomplete="off">
          <input type="text" id="title" placeholder="할 일을 입력하세요" required />
          <div class="row">
            <input type="text" id="category" placeholder="카테고리" />
            <input type="date" id="due_date" />
            <button type="submit" class="add-btn" aria-label="할 일 추가">＋</button>
          </div>
        </form>

        <div class="filters">
          <button data-filter="today" class="active">오늘 할 일</button>
          <button data-filter="all">전체</button>
        </div>

        <ul id="todo-list"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
